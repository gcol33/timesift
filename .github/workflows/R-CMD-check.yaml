name: R-CMD-check

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest,  r: 'release', torch: true}
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: macos-latest,   r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # The libtorch runtime is a download rather than a CRAN install, so it is fetched on one
      # platform and the encoder tests skip themselves on the others.
      TORCH_INSTALL: ${{ matrix.config.torch && '1' || '0' }}
      # tests/spelling.R checks the prose against inst/WORDLIST and fails the check on a word it
      # does not know, and it runs only where NOT_CRAN is set, which rcmdcheck does not do itself.
      NOT_CRAN: true

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      # CRAN's macOS builder compresses some of its binaries with zstd, which pak refuses to
      # extract, and it stops there rather than reaching for the source package, so a dependency
      # served that way ends the job before anything of ours is compiled (r-lib/pkgdepends#485).
      # Base R reads the format, so that platform installs its dependencies with it. Naming the
      # affected packages as `?source` instead does not work: pak drops the parameter where the
      # package is also reached as somebody else's dependency.
      - uses: r-lib/actions/setup-r-dependencies@v2
        if: runner.os != 'macOS'
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          lib <- Sys.getenv("R_LIBS_USER")
          dir.create(lib, recursive = TRUE, showWarnings = FALSE)
          .libPaths(c(lib, .libPaths()))
          install.packages(c("remotes", "rcmdcheck"))
          remotes::install_deps(dependencies = TRUE)
        shell: Rscript {0}

      # glmnet, lme4, lmerTest and emmeans arrive with the suggested dependencies above, so the
      # vignettes are built here rather than skipped as they are locally.
      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual")'
