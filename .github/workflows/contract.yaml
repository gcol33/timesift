name: contract

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions: read-all

# The two implementations agree or they do not, and a diff that touches one side cannot show it.
# Both suites read inst/spec/fixtures/ and assert the same digests, so this job runs them together
# and fails whichever side moved a digest.
jobs:
  contract:
    runs-on: ubuntu-latest
    name: both suites, one set of fixtures

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: any::testthat, any::cpp11

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install both implementations from the same checkout
        run: |
          R CMD INSTALL .
          python -m pip install --upgrade pip
          python -m pip install ".[test]"

      # The R suite reads the copy under the installed package and the Python suite reads the one in
      # the checkout, so the digests only pin the two implementations together while those are the
      # same bytes.
      - name: The spec the R package ships is the one the Python suite reads
        run: |
          Rscript -e '
            inst <- system.file("spec", package = "timesift")
            repo <- "inst/spec"
            files <- c("representation.md",
                       file.path("fixtures", sort(list.files(file.path(repo, "fixtures")))))
            stopifnot(length(files) > 1L,
                      all(file.exists(file.path(inst, files))),
                      identical(unname(tools::md5sum(file.path(repo, files))),
                                unname(tools::md5sum(file.path(inst, files)))))
            cat("the installed spec matches the repository copy,", length(files), "files\n")'

      # The files each side runs are the files that read the fixtures, found by what they call
      # rather than named in a list a new fixture test can be left out of. A lookback digest moved
      # without this job seeing it while the list said "fixtures" and nothing else.
      - name: The R side against the fixtures
        run: |
          Rscript -e '
            library(testthat); library(timesift)
            files <- list.files("tests/testthat", pattern = "^test-.*[.]R$")
            reads <- vapply(files, function(f) {
              any(grepl("fixture_dir()", readLines(file.path("tests/testthat", f)), fixed = TRUE))
            }, logical(1L))
            stopifnot(sum(reads) >= 3L)
            filter <- paste(sub("[.]R$", "", sub("^test-", "", files[reads])), collapse = "|")
            cat("the R files that read the fixtures:", filter, "\n")
            test_dir("tests/testthat", package = "timesift", filter = filter,
                     stop_on_failure = TRUE)'

      - name: The Python side against the same fixtures
        run: |
          files=$(grep -l '"inst" / "spec" / "fixtures"' python/tests/test_*.py)
          test "$(echo "$files" | wc -l)" -ge 3
          echo "the Python files that read the fixtures: $files"
          python -m pytest $files -q
