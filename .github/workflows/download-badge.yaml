name: download-badge

# Refreshes the total-downloads badge: CRAN and PyPI lifetime downloads summed into the endpoint
# file shields.io reads from the badges branch. It runs on request and when a release is
# published, so the number moves with releases.

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  badge:
    runs-on: ubuntu-latest
    name: the badges branch carries the current total

    steps:
      - uses: actions/checkout@v4
        with:
          path: source

      - name: check out the badges branch, creating it on first run
        run: |
          if git -C source ls-remote --exit-code --heads origin badges >/dev/null; then
            git clone --branch badges --single-branch "https://github.com/${GITHUB_REPOSITORY}.git" badges
          else
            git init -b badges badges
            git -C badges remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: sum the downloads
        run: python source/tools/download_total.py badges

      - name: publish
        working-directory: badges
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md downloads.json pypi_daily.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "downloads: refresh the total"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push origin badges
