name: libcxx

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag, branch or commit whose sources are checked (default: the dispatched one)'
        required: false
        default: ''
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions: read-all

jobs:
  check:
    runs-on: ubuntu-latest
    # CRAN's clang checks build R and every package against LLVM's own standard library, libc++,
    # with libc++abi beneath it. From LLVM 23 libc++ no longer includes headers such as <exception>
    # through the ones a source does include, which fails at compile time, and an exception that
    # crosses that runtime differently from libstdc++'s fails only when the tests run. The r-hub
    # container is that toolchain, so the job runs the full check on it, as CRAN runs it.
    name: clang 23 with libc++ (r-hub)
    container:
      image: ghcr.io/r-hub/containers/clang23:latest
    # torch and terra are left out: torch's tests skip without its runtime library, and terra
    # needs GDAL, which the container does not carry. Nothing else in Suggests is skipped.
    env:
      _R_CHECK_FORCE_SUGGESTS_: false

    steps:
      - uses: r-hub/actions/checkout@v1
        with:
          ref: ${{ inputs.ref }}
      - uses: r-hub/actions/platform-info@v1
      - uses: r-hub/actions/setup-deps@v1
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::rcmdcheck
            any::testthat
            any::withr
            any::knitr
            any::rmarkdown
            any::spelling
            any::glmnet
            any::lme4
            any::lmerTest
            any::emmeans
      - uses: r-hub/actions/run-check@v1
