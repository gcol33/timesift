name: pytest

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions: read-all

jobs:
  pytest:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (python ${{ matrix.config.python }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest,  python: '3.11'}
          - {os: ubuntu-latest,  python: '3.12', torch: true}
          - {os: ubuntu-latest,  python: '3.13'}
          - {os: windows-latest, python: '3.12'}
          - {os: macos-latest,   python: '3.12'}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.config.python }}

      - name: Install the package and its test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test,sklearn]"

      # The default index serves the CUDA build on Linux, which is gigabytes for a runner that has
      # no device. The encoder tests skip themselves everywhere this step does not run.
      - name: Install torch
        if: matrix.config.torch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run the suite
        run: python -m pytest python/tests -q

  reference:
    runs-on: ubuntu-latest
    name: the reference pages match the sources

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Reads the sources with ast rather than importing them, so this needs neither the
      # compiled core nor numpy.
      - name: Check the generated Python reference
        run: python tools/python_reference.py --check
