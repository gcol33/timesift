name: site

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions: read-all

# The site under docs/ is built locally, by build_site.R, because the build post-processes the
# figures in a way a plain pkgdown build does not. What this job holds is that the committed build
# is the one the sources render to: build_site.R writes a digest of every source the site is
# rendered from into docs/, and a push whose sources digest to something else fails here until
# the site is rebuilt and committed with them.
jobs:
  site:
    runs-on: ubuntu-latest
    name: docs/ is built from the current sources

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - name: Compare the committed site's digest with the sources
        run: Rscript tools/site_digest.R --check
