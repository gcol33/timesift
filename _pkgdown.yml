url: https://gillescolling.com/timesift/
template:
  bootstrap: 5
  bootswatch: sandstone
  light-switch: yes
  includes:
    in_header: |
      <style>
      .lang-split { table-layout: fixed; width: 100%; border: 0; }
      .lang-split > tbody > tr > td { border: 0; padding: 0 1rem 0 0; }
      .lang-split > tbody > tr > td:last-child { padding-right: 0; }
      .lang-split pre { overflow-x: auto; }
      </style>
      <script>
      (function () {
        var D = String.fromCharCode(36);
        window.MathJax = {
          tex: {
            inlineMath: [[D, D], ["\\(", "\\)"]],
            displayMath: [[D + D, D + D], ["\\[", "\\]"]]
          },
          chtml: { linebreaks: { automatic: true, width: "90% container" } },
          svg: { linebreaks: { automatic: true, width: "90% container" } },
          options: { renderActions: { addMenu: [] } }
        };
      })();
      </script>
figures:
  dev: svglite::svglite
  fig.ext: svg
  bg: '#F5F6F8'
navbar:
  structure:
    left:
    - r
    - python
    - articles
    - contract
    - news
    right:
    - search
    - github
    - lightswitch
  components:
    r:
      text: R
      menu:
      - text: Get started
        href: articles/timesift.html
      - text: Reference
        href: reference/index.html
    python:
      text: Python
      menu:
      - text: Get started
        href: articles/python.html
      - text: Reference
        href: articles/python-reference.html
    articles:
      text: Articles
      menu:
      - text: Reproducing the study
        href: articles/reproducing-schrankogel.html
      - text: Coming from biomod2
        href: articles/biomod2.html
    contract:
      text: Contract
      href: articles/contract.html
reference:
- title: The one call
  desc: |
    Two tables to a scored comparison of representations, and the prediction that follows from it.
  contents:
  - timesift
  - combine
  - timesift_report
  - predict.timesift
  - project
  - range_change
  - plot.timesift_range_change
  - pseudo_absences
  - plot.timesift
- title: Representations
  desc: |
    How a series becomes the array a learner reads, and the set a run is compared across.
  contents:
  - native
  - grains
  - build_representation
- title: Learners
  desc: |
    The arms that ship, how they are trained, and the interface a learner of your own goes through.
  contents:
  - elasticnet
  - stepwise
  - forest
  - tree
  - boosting
  - maxnet
  - envelope
  - mars
  - discriminant
  - additive
  - hierarchical
  - torch_learners
  - train_control
  - learner
  - register_learner
  - tune
  - register_tuning
- title: The split and the cells
  desc: |
    One fold map read by everything that scores, and the cells a score is defined on, computed with no model involved.
  contents:
  - cv
  - block_cv
  - env_cv
  - fold_map
  - scorable_cells
- title: Combining the candidates
  desc: |
    Weights fitted on the out-of-fold predictions alone.
  contents:
  - ensemble
  - ensemble_fit
  - ensemble_combine
  - ensemble_spread
  - ensemble_weights
- title: Scoring and comparison
  desc: |
    The metrics, the paired contrast between two arms on matched cells, every grain against a learner's best, the inflation of a score read at its own best threshold, and what a fitted model read.
  contents:
  - tss
  - roc_auc
  - average_precision
  - kappa_score
  - table_metric
  - boyce_index
  - regression_metric
  - ordinal_metric
  - score_predictions
  - paired_contrast
  - grain_contrasts
  - tss_inflation
  - implied_skill
  - occlusion
  - response_curve
  - plot.timesift_response_curve
- title: The arrays themselves
  desc: |
    Readings in long form to a `[unit, bin, channel]` array, reachable without the fitting layer.
  contents:
  - grain_matrix
  - lookback_matrix
  - coverage
  - timesift_set
  - calendar_channels
  - bind_channels
  - feature_matrix
  - as.matrix.timesift_matrix
- title: One grain at a time
  desc: |
    Fitting across a set of grains on its own split, and reading the grain a ladder saturates at.
  contents:
  - grain_ladder
  - fit_learner
  - select_grain
  - plot.timesift_ladder
  - plot.timesift_selection
- title: Extending
  desc: |
    The response head and the metric are registrations, never a fork of the fitting code.
  contents:
  - register_response
  - positive_weights
  - register_metric
- title: What crosses the boundary
  desc: |
    The three artifacts a split is carried in, and the digest that says two arrays are the same array.
  contents:
  - artifacts
  - digest_array
- title: A record to test on
  desc: |
    A simulated record with a grain planted in it, to test a run against a known answer.
  contents: simulate_records
- title: The package
  contents: timesift-package
articles:
- title: Get started
  desc: |
    The whole path on a small simulated record, from two tables to a scored comparison and the prediction that follows from it.
  contents:
  - timesift
  - articles/python
- title: Articles
  contents:
  - reproducing-schrankogel
  - articles/biomod2
- title: The contract
  desc: |
    What both implementations answer to, and what each language carries.
  contents: articles/contract
- title: Python reference
  desc: |
    The Python package's functions, classes and values, under the sections of the R reference.
  navbar: ~
  contents:
  - articles/python-reference
  - articles/python-one-call
  - articles/python-representations
  - articles/python-learners
  - articles/python-split
  - articles/python-combining
  - articles/python-scoring
  - articles/python-arrays
  - articles/python-ladder
  - articles/python-extending
  - articles/python-artifacts
  - articles/python-simulate
