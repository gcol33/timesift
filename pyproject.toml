[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.0"]
build-backend = "scikit_build_core.build"

[project]
name = "timesift"
# The version is `DESCRIPTION`'s. A wheel and a tarball built from one commit carry one
# version, and a bump is one edit rather than three that can disagree.
dynamic = ["version"]
description = "Learn predictive representations of time-varying data"
readme = "python/README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Gilles Colling", email = "gilles.colling051@gmail.com" }]
# Windows ships no IANA database for zoneinfo, and a zone is what the binning of a zoned
# record is read through.
dependencies = ["numpy>=1.24", "tzdata; platform_system == 'Windows'"]

[project.optional-dependencies]
torch = ["torch>=2.0"]
# 1.8 is where `l1_ratios` alone selects the elastic net. Under the versions before it the
# mixing is read only beside `penalty="elasticnet"` and is otherwise warned about and ignored,
# so `alpha` would silently do nothing and the learner would fit an L2-only logistic. Branching
# on the version would be two paths to keep true; the floor is one.
sklearn = ["scikit-learn>=1.8"]
# pandas is what a user's table is, so the suite reads one through `timesift()`; the package
# itself never imports it.
test = ["pytest>=8.0", "pandas>=2.0"]

[project.urls]
Homepage = "https://gillescolling.com/timesift/"
Source = "https://github.com/gcol33/timesift"
Issues = "https://github.com/gcol33/timesift/issues"

[tool.scikit-build]
minimum-version = "0.10"
wheel.packages = ["python/timesift"]
sdist.include = [
  "CMakeLists.txt",
  "src/ts_core.cpp",
  "src/ts_calendar.cpp",
  "src/ts_core.h",
  "python/ts_py.cpp",
  "python/tests/**",
  "inst/spec/**",
  "LICENSE",
  # The version is read from it at build time, so a wheel built from the tarball
  # resolves the same one the tarball was cut with.
  "DESCRIPTION",
]
sdist.exclude = [
  "R/",
  "man/",
  "tests/",
  "tools/",
  "vignettes/",
  "build_site.R",
  "inst/reproduce/",
  "dev_notes/",
  "docs/",
  "src/cpp11.cpp",
  "src/ts_r.cpp",
  "NAMESPACE",
  "NEWS.md",
  "CLAUDE.md",
  "_pkgdown.yml",
  ".Rbuildignore",
]

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "DESCRIPTION"
regex = '(?im)^Version: *(?P<value>\S+)'

# The wheels a release publishes, one per interpreter and platform the pytest workflow runs on.
# Each is installed on a clean interpreter and the suite run against it from the checkout, which
# is where the fixtures it reads live, so a wheel that imports only on the machine that built it
# fails here.
[tool.cibuildwheel]
build = "cp311-* cp312-* cp313-*"
skip = "*-musllinux_* *-win32 *_i686"
test-extras = ["test", "sklearn"]
test-command = "pytest {project}/python/tests -q -p no:cacheprovider"

[tool.pytest.ini_options]
testpaths = ["python/tests"]
